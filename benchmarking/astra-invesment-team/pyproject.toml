[project]
name = "astra-invesment-team"
version = "1.0.0"
requires-python = ">=3.12,<4"
description = "Astra investment team — benchmark against Agno"

dependencies = [
  "astra-framework",
  "bench-harness",
  "google-genai",
  "yfinance",
  "fredapi",
  "pandas",
  "pydantic",
  "python-dotenv",
]

[tool.uv.sources]
astra-framework = { path = "../../astra/framework", editable = true }
bench-harness = { path = "../harness", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "teams*", "tools*", "context*"]

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
