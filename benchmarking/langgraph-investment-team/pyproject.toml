[project]
name = "langgraph-investment-team"
version = "1.0.0"
requires-python = ">=3.12,<4"
description = "LangGraph investment research team — hand-authored graph baseline"

dependencies = [
  "langgraph",
  "langchain-google-genai",
  "langchain",
  "google-genai",
  "bench-harness",
  "yfinance",
  "fredapi",
  "pandas",
  "pydantic",
  "python-dotenv",
]

[tool.uv.sources]
bench-harness = { path = "../harness", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nodes*", "graph*", "tools*", "context*"]

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
